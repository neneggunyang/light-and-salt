<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light & Salt</title>
<style>
*{box-sizing:border-box}
:root{
  --sky:#b9def0;--sky-deep:#5f9fc1;--sky-ink:#315b70;
  --mint:#c8dfc9;--mint-deep:#6e9b76;--mint-ink:#3f6547;
  --paper:rgba(255,255,255,.72);--ink:#31413d;--muted:#687873;
  --line:rgba(70,105,95,.18);--shadow:0 18px 55px rgba(55,85,80,.14)
}
html,body{min-height:100%;margin:0}
body{
  color:var(--ink);font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  background:linear-gradient(110deg,#c9e7f4 0%,#e8f2ec 48%,#cfe5cf 100%);
  overflow-x:hidden
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent 48%,rgba(255,255,255,.12));z-index:-1}
body:after{content:"";position:fixed;inset:18px;border:1px solid rgba(255,255,255,.55);pointer-events:none;z-index:5}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:45px 20px}
.portal{width:min(940px,100%);padding:44px 34px 36px;text-align:center}
.ornament{color:#6f8f8b;font-size:13px;letter-spacing:.55em;margin-bottom:16px}
.title{margin:0;font-family:Georgia,"Times New Roman","Baskerville",serif;font-weight:500;font-size:clamp(43px,8vw,76px);letter-spacing:.075em;line-height:1;color:#354844;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.title small{display:block;font-size:.24em;letter-spacing:.35em;margin-top:18px;color:#617b76;font-weight:400}
.rule{width:min(460px,78%);height:2px;background:linear-gradient(90deg,transparent,#80a9ad 25%,#88aa8b 75%,transparent);margin:28px auto 22px}
.tagline{margin:0 auto;max-width:720px;color:#425750;font-size:clamp(17px,3vw,22px);font-weight:700;line-height:1.75;letter-spacing:-.04em;word-break:keep-all}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:38px}
.choice{position:relative;display:block;text-decoration:none;color:inherit;overflow:hidden;border:1px solid rgba(255,255,255,.72);padding:31px 24px 27px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
.choice:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.9}
.choice.webtoon{background:rgba(237,249,255,.72)}
.choice.webtoon:before{background:linear-gradient(145deg,rgba(174,220,241,.82),rgba(241,251,255,.5))}
.choice.webnovel{background:rgba(240,249,239,.72)}
.choice.webnovel:before{background:linear-gradient(145deg,rgba(192,222,194,.82),rgba(246,252,244,.5))}
.choice:hover{transform:translateY(-5px);box-shadow:0 24px 60px rgba(55,85,80,.19)}
.choice.webtoon:hover{border-color:rgba(95,159,193,.6)}
.choice.webnovel:hover{border-color:rgba(110,155,118,.65)}
.icon{font-size:40px;margin-bottom:10px}
.choice h2{margin:0 0 9px;font-size:25px;letter-spacing:-.06em}
.webtoon h2{color:var(--sky-ink)}.webnovel h2{color:var(--mint-ink)}
.choice p{margin:0;color:#5f706b;font-size:13px;line-height:1.75}
.enter{display:inline-block;margin-top:19px;padding:9px 17px;border:1px solid currentColor;font-size:13px;background:rgba(255,255,255,.52);transition:.15s}
.webtoon .enter{color:#4d86a5}.webnovel .enter{color:#5c8964}
.choice:hover .enter{background:rgba(255,255,255,.78)}
.footer{margin-top:31px;color:#71827c;font-size:11px;letter-spacing:.1em}
@media(max-width:620px){
  .wrap{padding:28px 14px}.portal{padding:30px 5px}.cards{grid-template-columns:1fr;gap:14px}.choice{padding:25px 19px}.title{font-size:clamp(39px,14vw,62px)}.tagline{font-size:17px}.ornament{letter-spacing:.4em}
}
</style>
</head>
<body>
<div class="wrap">
  <main class="portal">
    <div class="ornament">✦　✦　✦</div>
    <h1 class="title">Light &amp; Salt<small>🕯️ &nbsp;빛과 소금&nbsp; 🧂</small></h1>
    <div class="rule"></div>
    <p class="tagline">컨텐츠계의 빛과 소금인 당신의 지갑과 서재를 지켜드립니다.</p>

    <section class="cards" aria-label="서재 선택">
      <a class="choice webtoon" href="https://neneggunyang.github.io/webtoon-light-and-salt/" target="_blank" rel="noopener">
        <div class="icon">🗯️</div>
        <h2>웹툰 서재</h2>
        <p>내가 산 웹툰을 기록하고<br>읽은 작품을 관리합니다.</p>
        <span class="enter">웹툰 서재로 들어가기 →</span>
      </a>
      <a class="choice webnovel" href="./webnovel.html">
        <div class="icon">📗</div>
        <h2>웹소설 서재</h2>
        <p>내가 산 웹소설을 기록하고<br>읽은 작품을 관리합니다.</p>
        <span class="enter">웹소설 서재로 들어가기 →</span>
      </a>
    </section>

    <div class="footer">YOUR WALLET · YOUR LIBRARY · YOUR RECORD</div>
  </main>
</div>
</body>
</html>
